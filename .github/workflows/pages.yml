name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-from-branch:
    name: Enable Pages from main / root
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          gh api repos/${GITHUB_REPOSITORY}/pages >/tmp/pages.json 2>/tmp/pages.err
          if [ $? -eq 0 ]; then
            echo "$payload" | gh api --method PUT repos/${GITHUB_REPOSITORY}/pages \
              -H "Accept: application/vnd.github+json" \
              --input -
          else
            echo "$payload" | gh api --method POST repos/${GITHUB_REPOSITORY}/pages \
              -H "Accept: application/vnd.github+json" \
              --input -
          fi
          status=$?
          gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
          gh api repos/${GITHUB_REPOSITORY}/pages
          exit $status

  deploy:
    name: Deploy static site
    needs: enable-from-branch
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
